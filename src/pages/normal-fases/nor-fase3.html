<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Normal • Nível 3: Flexbox</title>
    <link rel="stylesheet" href="../../css/fases.css">
</head>
<body>
    <h1 class="page-title">NÍVEL 3: LAYOUT & FLEXBOX</h1>

    <div class="container">
        <div class="cards-grid">
            
            <div class="arcade-card">
                <div class="card-header-title">FLEX CONTAINER</div>
                <div class="inner-frame" id="flex-demo-box" style="display:flex; gap:5px; justify-content:center; align-items:center;">
                    <div style="background:#ff0000; padding:5px; font-size:0.5rem;">1</div>
                    <div style="background:#ff0000; padding:5px; font-size:0.5rem;">2</div>
                </div>
                <div class="xp-section">
                    <div class="xp-text">PROGRESSO: 150/200 XP</div>
                    <div class="xp-bar-container"><div class="xp-bar-fill" style="width: 75%;"></div></div>
                </div>
                <div class="attributes-title">PROPRIEDADES:</div>
                <ul class="attributes-list">
                    <li>DISPLAY FLEX</li>
                    <li>JUSTIFY-CONTENT</li>
                    <li>ALIGN-ITEMS</li>
                </ul>
            </div>

            <div class="arcade-card">
                <div class="card-header-title">CONTROLES</div>
                <div class="inner-frame">
                    <label style="font-size:0.5rem;">JUSTIFY-CONTENT:</label>
                    <select id="select-justify">
                        <option value="center">CENTER</option>
                        <option value="space-between">SPACE-BETWEEN</option>
                        <option value="flex-start">FLEX-START</option>
                    </select>
                </div>
                <div class="attributes-title">EFEITO:</div>
                <ul class="attributes-list">
                    <li>ALINHAMENTO</li>
                    <li>ESPAÇAMENTO</li>
                </ul>
            </div>

            <div class="arcade-card">
                <div class="card-header-title">DESAFIO</div>
                <div class="inner-frame">
                    <p style="font-size:0.55rem; line-height:1.4;">Como centralizar na horizontal?</p>
                </div>
                <button class="quiz-option-btn" data-correct="true">JUSTIFY-CONTENT</button>
                <button class="quiz-option-btn" data-correct="false">FLOAT LEFT</button>
                <div class="attributes-title" style="margin-top:10px;">RECOMPENSA:</div>
                <ul class="attributes-list">
                    <li>+50 XP</li>
                </ul>
            </div>

        </div>

        <div style="text-align: center;">
            <a href="page4-js-basico.html" class="btn-arcade">PRÓXIMA PÁGINA: JS BÁSICO ➔</a>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
