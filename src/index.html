<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha o seu Avatar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="tela1">

        <h1>Escolha o seu avatar:</h1>
        <div>
            <button class="sonic">
                <h2>Sonic</h2>
            </button>
        
        
            <button class="superman">
                <h2>Superman</h2>
            </button>
        
            <button class="chapolin">
                <h2>Chapolin</h2>
            </button>
        </div>

    </section>


    <section id="tela2">

        <h1>Escolha o seu mapa:</h1>
        <div>
            <button id="mapa_normal">
                <h2>Normal</h2>
            </button>
        
            <button id="mapa_invertido">
                <h2>Invertido</h2>
            </button>
        </div>

    </section>


    <section id="tela3">

        <img src="" alt="Avatar escolhido" id="avatar"><br>

        <button id="voltar">Início</button>

    </section>

    <script src="js/app.js"></script>
</body>
</html>
